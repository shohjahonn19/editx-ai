<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editx AI</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#02030a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Editx AI"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--s1:#14141c;--s2:#1d1d28;--bd:#2a2a38;--tx:#f5f5fa;--mu:#8c8ca3;--ac:#8b5cf6;--ac2:#ec4899;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;padding:0 14px 230px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px}
.top h1{margin:0;font-size:20px;letter-spacing:-.02em}.top h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{position:relative;background:var(--s1);border:1.5px dashed var(--bd);border-radius:18px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:130px;justify-content:center}
.pick.ok{border:1.5px solid var(--ac);background:linear-gradient(160deg,#241a3d,var(--s1))}
.pick .ic{width:46px;height:46px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:22px}
.pick b{font-size:14px}.pick span{font-size:12px;color:var(--mu);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.stage{margin-top:12px;background:var(--s1);border-radius:20px;overflow:hidden;display:grid;place-items:center;min-height:150px;position:relative}
#ph{padding:34px 20px;text-align:center;color:var(--mu);font-size:13px;line-height:1.5}#ph big{display:block;font-size:34px;margin-bottom:6px}
canvas,video.o{width:100%;height:auto;max-height:66vh;object-fit:contain;background:#000;display:none}
#bar{height:4px;background:var(--s2);border-radius:2px;margin-top:10px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
#st{font-size:12.5px;color:var(--mu);min-height:18px;margin-top:6px}
button{border:0;font:inherit;cursor:pointer;color:inherit}
#save{display:none;width:100%;margin-top:10px;padding:14px;border-radius:14px;font-weight:600;background:var(--s2);border:1px solid var(--ac)}
.panel{display:none;flex-direction:column;gap:10px;margin-top:12px;background:var(--s1);border-radius:18px;padding:14px}
.panel h3{margin:0;font-size:12px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
#tl{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}#tl b{flex:none;font-weight:500;font-size:12px;padding:10px 12px;border-radius:10px;background:linear-gradient(135deg,#2b2144,#3a1d3b);border:1px solid var(--bd)}
.cmd{display:flex;gap:8px;background:var(--s2);border-radius:14px;padding:5px 5px 5px 12px;align-items:center}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:14px}
.cmd button{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));font-size:16px}
.note{margin:0;color:var(--mu);font-size:12px;line-height:1.4}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(20,20,28,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.dk{max-width:480px;margin:0 auto;padding:0 14px;display:flex;flex-direction:column;gap:10px}
#styles{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;width:74px;height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;border:2px solid transparent;cursor:pointer;opacity:.7}
.chip i{font-style:normal;font-size:20px}.chip.on{border-color:#fff;opacity:1}
[data-s=phonk]{background:linear-gradient(135deg,#7f1d1d,#18181b)}[data-s=cinema]{background:linear-gradient(135deg,#0e7490,#1e293b)}[data-s=aesthetic]{background:linear-gradient(135deg,#f472b6,#a78bfa)}[data-s=anime]{background:linear-gradient(135deg,#f59e0b,#ef4444)}[data-s=vhs]{background:linear-gradient(135deg,#3b82f6,#4c1d95)}
.opts{display:flex;gap:6px}.opts select,.opts input{flex:1;min-width:0;appearance:none;-webkit-appearance:none;background:var(--s2);border:0;border-radius:20px;padding:9px 10px;color:var(--tx);font-size:12.5px;text-align:center;outline:0}
#go{padding:15px;border-radius:16px;font-size:16px;font-weight:700;background:linear-gradient(90deg,var(--ac),var(--ac2))}#go:disabled{opacity:.35}

:root{--bg:#02030a;--s1:#0b0d1a;--s2:#121528;--bd:#1f2547;--ac:#3b82f6;--ac2:#a855f7}
body{background:radial-gradient(800px 420px at 50% -8%,#1c2270aa,transparent),#02030a;font-family:"Rajdhani",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;font-size:16px}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(#3b82f612 1px,transparent 1px),linear-gradient(90deg,#3b82f612 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.app{position:relative}
.top h1{display:flex;align-items:center;gap:10px;font-family:"Orbitron",system-ui,sans-serif;font-size:19px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.top h1 img{width:38px;height:32px;mix-blend-mode:screen;filter:drop-shadow(0 0 8px #6d5dfc)}
.badge{font-family:"Orbitron",sans-serif;font-size:10px;letter-spacing:.1em;box-shadow:0 0 14px #7c5cff88;border-radius:4px;background:linear-gradient(90deg,#2563eb,#9333ea)}
.pick,.stage,.panel{border-radius:6px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.pick{border:1.5px solid var(--bd);background:linear-gradient(160deg,#0f1330,var(--s1))}
.pick.ok{border-color:#6d5dfc;background:linear-gradient(160deg,#1b1a5a,#0b0d1a)}
.pick .ic{border-radius:10px;background:#141a3d;box-shadow:inset 0 0 12px #3b82f633,0 0 14px #3b82f633}
.pick b{font-family:"Orbitron",sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
#ph .lg{display:block;width:150px;height:auto;margin:0 auto 8px;mix-blend-mode:screen;animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px #3b82f6) brightness(.95)}50%{filter:drop-shadow(0 0 22px #a855f7) brightness(1.2)}}
#ph{color:#8f95c4;font-size:14px;letter-spacing:.03em}
.stage{background:linear-gradient(180deg,#07091a,#04050d);border:1px solid #1f2547}
#bar{height:3px;box-shadow:0 0 10px #3b82f655}#bar i{box-shadow:0 0 12px #8b5cf6}
.dock{background:rgba(3,5,16,.93);border-top:1px solid #3b5bdb66;box-shadow:0 -8px 30px #3b82f622}
.chip{border-radius:10px;font-family:"Orbitron",sans-serif;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
.chip.on{border-color:#a5b4fc;box-shadow:0 0 16px #7c5cffaa}
.opts select,.opts input{background:#0f1330;border:1px solid #1f2547;border-radius:8px;font-family:inherit;font-weight:600}
#go{border-radius:10px;font-family:"Orbitron",sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,#2563eb,#7c3aed,#c026d3);box-shadow:0 0 24px #6d5dfc77}
#save{border-radius:10px;border:1px solid #6d5dfc;box-shadow:0 0 16px #6d5dfc44}
.cmd{border:1px solid #1f2547;border-radius:10px;background:#0f1330}.cmd button{border-radius:8px}
#tl b{border-radius:6px;border-color:#2b3a8f;background:linear-gradient(135deg,#17205a,#2a1a55)}
#ph{padding:0;width:100%;height:100%;display:block}
#ph .lg{width:100%;height:100%;max-width:none;margin:0;object-fit:cover;display:block;mix-blend-mode:screen;animation:glow 3.2s ease-in-out infinite}
.stage{aspect-ratio:1/1;min-height:0;animation:edge 3.2s ease-in-out infinite}
@keyframes edge{0%,100%{box-shadow:inset 0 0 0 2px #3b82f6,inset 0 0 46px #3b82f677}50%{box-shadow:inset 0 0 0 2px #a855f7,inset 0 0 46px #a855f799}}
#st{text-align:center;font-size:15px;line-height:1.5;color:#8f95c4;margin-top:16px;letter-spacing:.03em}

 anime:{step:1,sp:[1,1.5,.6,2],fx:["punch","flash","shake","zoom"],rev:.15,stk:["💥","⭐","❗"],grade:"rgba(255,230,120,.1)",bars:0},

const seek=t=>new Promise(r=>{const h=()=>{v.removeEventListener("seeked",h);r()};v.addEventListener("seeked",h);v.currentTime=t;setTimeout(r,2000)});
function setSize(){const q=+$("q").value,a=$("ar").value,e=x=>Math.round(x/2)*2;
 if(a=="9:16"){W=q;H=e(q*16/9)}else if(a=="1:1"){W=H=q}else{H=q;W=e(q*16/9)}
 cv.width=W;cv.height=H;f=Math.min(W,H)/540;$("out").style.aspectRatio=W+"/"+H}
function analyzeMusic(buf,maxSec){
 const sr=buf.sampleRate,d=buf.getChannelData(0),n=Math.min(d.length,maxSec*sr|0),hop=512,env=[];
 for(let i=0;i+hop<=n;i+=hop){let s=0;for(let j=0;j<hop;j++)s+=d[i+j]*d[i+j];env.push(Math.sqrt(s/hop))}
 const fl=env.map((x,i)=>Math.max(0,x-(env[i-1]||0))),bt=[];let last=-1;
 for(let i=1;i<fl.length-1;i++){let m=0,c=0;for(let k=Math.max(0,i-43);k<Math.min(fl.length,i+43);k++){m+=fl[k];c++}m/=c;
  if(fl[i]>m*1.6+1e-4&&fl[i]>=fl[i-1]&&fl[i]>=fl[i+1]){const t=i*hop/sr;if(t-last>.3){bt.push({t,i});last=t}}}
 if(bt.length<4){bt.length=0;for(let t=.5;t<maxSec;t+=.5)bt.push({t,i:Math.round(t*sr/hop)})}
 const a=(x,y)=>{let s=0,c=0;for(let k=Math.max(0,x);k<Math.min(env.length,y);k++){s+=env[k];c++}return c?s/c:0},w=Math.round(.6*sr/hop);
 let drop=-1,best=0;bt.forEach((b,j)=>{if(b.t<maxSec*.2)return;const r=a(b.i,b.i+w)/(a(b.i-w,b.i)+1e-4);if(r>best){best=r;drop=j}});
 return{bt,drop:best>1.4?bt[drop].t:-1};
}
async function scanVideo(dur){
 const key=vf.name+vf.size;if(scanC[key])return scanC[key];
 const c=document.createElement("canvas");c.width=32;c.height=18;const x=c.getContext("2d",{willReadFrequently:true}),n=Math.min(36,Math.max(4,Math.floor(dur))),out=[];let prev=null;
 for(let i=0;i<n;i++){const t=dur*(i+.5)/n;await seek(t);x.drawImage(v,0,0,32,18);const d=x.getImageData(0,0,32,18).data;let m=0;
  if(prev)for(let j=0;j<d.length;j+=4)m+=Math.abs(d[j]-prev[j])+Math.abs(d[j+1]-prev[j+1]);prev=d;out.push({t,m});say("Sahnalar tahlil qilinmoqda…",10+i/n*30)}
 out.sort((a,b)=>b.m-a.m);return scanC[key]=out;
}
function plan(an,total,dur,sc,S){
 const pts=[0];an.bt.forEach((b,i)=>{if(i%S.step==0&&b.t>pts[pts.length-1]+.25&&b.t<total-.3)pts.push(b.t)});pts.push(total);
 const out=[];
 for(let i=0;i<pts.length-1;i++){
  const d=pts[i+1]-pts[i];let sp=S.sp[i%S.sp.length];if(d*sp>dur*.9)sp=dur*.9/d;
  const need=d*sp,top=sc[i%sc.length].t,src=Math.min(Math.max(0,top-need*.3),Math.max(0,dur-need));
  out.push({s:pts[i],e:pts[i+1],sp,sp2:sp,src,rev:i>0&&Math.random()<S.rev,fx:S.fx[Math.floor(Math.random()*S.fx.length)],
   stk:i%3==1?S.stk[Math.floor(Math.random()*S.stk.length)]:null,x:W*(.25+Math.random()*.5),y:H*(.2+Math.random()*.5)});
 }
 if(an.drop>0){const di=out.findIndex(g=>g.e>an.drop);
  if(di>0){const p=out[di-1];p.sp=p.sp2=.35;p.rev=false;p.fx="zoom";const g=out[di];g.sp=1.8;g.sp2=1;g.rev=false;g.fx="shake";g.drop=1;g.stk=S.stk[0]}}
 return out;
}
function draw(g,l,S,txt){
 const d=g.e-g.s,k=Math.max(0,1-l*4),q=k*k;let sc=1,dx=0,dy=0;
 if(g.fx=="punch")sc=1+.16*q;else if(g.fx=="zoom")sc=1+.25*l/d;
 else if(g.fx=="shake"){dx=(Math.random()-.5)*40*q*f;dy=(Math.random()-.5)*40*q*f;sc=1.06}
 const fit=(s,x,y)=>{const z=Math.max(W/v.videoWidth,H/v.videoHeight)*s,w=v.videoWidth*z,h=v.videoHeight*z;ctx.drawImage(v,(W-w)/2+x,(H-h)/2+y,w,h)};
 ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
 fit(sc,dx,dy);
 if((g.fx=="rgb"||S.scan)&&q>.02){ctx.globalCompositeOperation="lighter";ctx.globalAlpha=.35;fit(sc,-22*q*f,0);fit(sc,22*q*f,0);ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over"}
 if(g.fx=="glitch"&&q>.05)for(let i=0;i<5;i++){const y=Math.random()*H,h=(20+Math.random()*80)*f,o=(Math.random()-.5)*90*q*f;ctx.drawImage(cv,0,y,W,h,o,y,W,h)}
 if(g.fx=="invert"&&q>.05){ctx.globalCompositeOperation="difference";ctx.fillStyle="#fff";ctx.globalAlpha=Math.min(1,q*1.5);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over"}
 if(g.fx=="flash"||g.drop){ctx.fillStyle="rgba(255,255,255,"+(.75*q)+")";ctx.fillRect(0,0,W,H)}
 ctx.fillStyle=S.grade;ctx.fillRect(0,0,W,H);
 const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.7);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.45)");ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(S.scan){ctx.fillStyle="rgba(0,0,0,.14)";for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1.5)}
 if(S.bars){ctx.fillStyle="#000";ctx.fillRect(0,0,W,H*S.bars);ctx.fillRect(0,H*(1-S.bars),W,H*S.bars)}
 ctx.textAlign="center";ctx.textBaseline="middle";
 if(g.stk&&l<.7){const e=Math.min(1,l*6);ctx.font=(150*f*(e<1?e*1.25:1))+"px serif";ctx.fillText(g.stk,g.x,g.y)}
 if(txt&&g.tx&&l<1.4){const e=Math.min(1,l*5),a=l>1?1-(l-1)/.4:1;ctx.globalAlpha=Math.max(0,a);ctx.font="800 "+(W*.1*(.6+.4*e))+"px system-ui,sans-serif";
  ctx.lineWidth=8*f;ctx.strokeStyle="#000";ctx.strokeText(txt,W/2,H*.78);ctx.fillStyle="#fff";ctx.fillText(txt,W/2,H*.78);ctx.globalAlpha=1}
}
function timeline(){$("tl").innerHTML=segs.map((g,i)=>"<b>"+(i+1)+" · "+g.fx+" · "+g.sp.toFixed(1)+"x"+(g.rev?" ⟲":"")+(g.drop?" 💥":"")+"</b>").join("");$("ed").style.display="flex"}
async function render(S){
 setSize();const total=segs[segs.length-1].e,txt=$("txt").value.trim();
 const tg=segs.find(g=>g.drop)||segs[0];segs.forEach(g=>g.tx=g===tg);
 if(!cv.captureStream||!window.MediaRecorder)throw new Error("Brauzer video yozishni qoʻllamaydi. Yangi Chrome yoki Safari 15+ kerak.");
 const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();await ac.resume();
 const dest=ac.createMediaStreamDestination(),src=ac.createBufferSource();src.buffer=music;src.connect(dest);src.connect(ac.destination);
 const types=["video/mp4;codecs=avc1,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
 const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||"";
 const rec=new MediaRecorder(new MediaStream([...cv.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]),mime?{mimeType:mime,videoBitsPerSecond:W>600?8e6:4e6}:{}),ch=[];
 rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 const done=new Promise(r=>rec.onstop=r);
 cv.style.display="block";$("ph").style.display="none";$("ph").parentNode.style.aspectRatio="auto";await seek(segs[0].src);
 let si=0,cur=-1,ls=0;const t0=ac.currentTime+.2;rec.start();src.start(t0,0,total);
 await new Promise(res=>{const loop=()=>{
  const t=ac.currentTime-t0;if(t>=total){v.pause();res();return}
  const tt=Math.max(0,t);while(si<segs.length-1&&tt>=segs[si].e)si++;const g=segs[si],d=g.e-g.s,l=tt-g.s;
  if(si!==cur){cur=si;if(g.rev)v.pause();else{v.currentTime=g.src;v.play().catch(()=>{})}}
  if(!g.rev)v.playbackRate=Math.min(4,Math.max(.25,g.sp+(g.sp2-g.sp)*l/d));
  else if(performance.now()-ls>70){ls=performance.now();v.currentTime=Math.max(0,g.src+d*g.sp-l*g.sp)}
  if(!v.seeking)draw(g,l,S,txt);say("Render: "+Math.round(tt/total*100)+"%",40+tt/total*60);requestAnimationFrame(loop)};loop()});
 rec.stop();await done;ac.close();
 blob=new Blob(ch,{type:rec.mimeType||mime||"video/webm"});
 cv.style.display="none";const o=$("out");o.src=URL.createObjectURL(blob);o.style.display="block";$("save").style.display="block";
}
async function run(replan){
 if(busy)return;busy=true;chk();$("go").textContent="Ishlanmoqda…";$("save").style.display="none";$("out").style.display="none";
 const S=ST[style];
 try{
  v.play().then(()=>v.pause()).catch(()=>{});
  const AC=window.AudioContext||window.webkitAudioContext,a0=new AC();a0.resume();
  const key=mf.name+mf.size;
  if(!music||music._k!==key){say("Musiqa yuklanmoqda…",3);music=await a0.decodeAudioData(await mf.arrayBuffer());music._k=key}
  a0.close();
  if(replan){
   if(v._k!==vf.name+vf.size){v.src=URL.createObjectURL(vf);v._k=vf.name+vf.size;
    await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=()=>j(new Error("Video ochilmadi. Boshqa format sinab koʻring."))})}
   const total=Math.min(+$("len").value,music.duration),an=analyzeMusic(music,total);
   say("Ritm topildi: "+an.bt.length+" zarba"+(an.drop>0?", drop "+an.drop.toFixed(1)+"s":""),8);
   const sc=await scanVideo(v.duration);setSize();segs=plan(an,total,v.duration,sc,S);
  }
  timeline();await render(S);say("Tayyor ✅ Pastdagi taymlayndan tahrirlashingiz mumkin.",100);
 }catch(e){cv.style.display="none";say("Xato: "+(e.message||e)+" — shu matnni menga yuboring.",0)}
 busy=false;$("go").textContent="✨ Avto-edit qilish";chk();
}
$("go").onclick=()=>run(true);
$("ap").onclick=()=>{const t=$("pr").value.toLowerCase(),re=/(\d+|oxir|bosh)\D{0,12}?(sekin|tez|teskari|glitch|shake|punch|rgb|flash|invert|zoom|stiker)/g;let m,n=0;
 while(m=re.exec(t)){const i=m[1]=="oxir"?segs.length-1:m[1]=="bosh"?0:+m[1]-1,g=segs[i];if(!g)continue;n++;const a=m[2];
  if(a=="sekin")g.sp=g.sp2=.4;else if(a=="tez")g.sp=g.sp2=2;else if(a=="teskari")g.rev=!g.rev;else if(a=="stiker")g.stk=ST[style].stk[0];else g.fx=a}
 if(!n){say("Buyruq tushunilmadi. Masalan: 2 sekin, oxiri glitch");return}run(false)};
